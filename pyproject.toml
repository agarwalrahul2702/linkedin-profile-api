[project]
name = "linkedin-profile-api"
version = "0.5.0"
description = "FastAPI service for structured LinkedIn profile extraction"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "pydantic==2.9.2",
    "tenacity==9.0.0",
    "cachetools==5.5.0",
]

[tool.vercel]
entrypoint = "app.main:app"
